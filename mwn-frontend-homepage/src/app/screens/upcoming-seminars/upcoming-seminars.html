<div class="p-5 md:!p-10">
  <span class="flex items-center gap-2 text-2xl md:text-4xl underline underline-offset-10 mb-5">
    <img src="assets/upcomingCalender.svg" alt="Calendar Icon" class="w-8 h-8" />
    Upcoming Seminars
  </span>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    @for (image of seminarImages; track image) {
    <img [src]="image" alt="Seminar"
      class="w-full cursor-pointer rounded-lg transition-transform duration-300 hover:scale-105" />
    }
  </div>
</div>
