<header
  class="fixed top-0 w-full z-10 bg-white/10 backdrop-blur-lg shadow shadow-base transition-transform duration-300 ease-in-out"
  [class.-translate-y-full]="!headerVisible"
  [class.translate-y-0]="headerVisible"
>
  <nav
    class="relative z-50 flex items-center justify-between py-2 px-6 sm:px-10"
  >
    <a href="#" class="nav-logo">
      <img src="assets/logo.svg" alt="Logo" class="h-10" />
    </a>

    <button
      (click)="toggleMenu()"
      class="sm:hidden focus:outline-none"
      aria-label="Toggle menu"
      [attr.aria-expanded]="isMenuOpen"
    >
      <svg
        *ngIf="!isMenuOpen; else closeIcon"
        class="w-6 h-6 text-black"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 8h16M4 16h16"
        />
      </svg>
      <ng-template #closeIcon>
        <svg
          class="w-6 h-6 text-black"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </ng-template>
    </button>

    <div
      *ngIf="isMenuOpen"
      (click)="toggleMenu()"
      class="fixed inset-0 z-40 bg-black bg-opacity-50 sm:hidden"
    ></div>

    <ul
      class="fixed top-0 right-0 z-50 flex h-screen w-64 flex-col gap-4 bg-gray-100 px-6 py-4 transition-transform duration-300 ease-in-out sm:static sm:flex-row sm:h-auto sm:w-auto sm:translate-x-0 sm:bg-transparent"
      [class.translate-x-full]="!isMenuOpen"
      [class.translate-x-0]="isMenuOpen"
    >
      <li class="mb-4 flex justify-end sm:hidden">
        <button
          (click)="toggleMenu()"
          class="focus:outline-none"
          aria-label="Close menu"
        >
          <svg
            class="w-6 h-6 text-black"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </li>

      <li *ngFor="let item of menuItems">
        <a
          [routerLink]="item.link"
          routerLinkActive="underline"
          [routerLinkActiveOptions]="{ exact: true }"
          class="block rounded px-2 py-1 text-black hover:font-semibold hover:text-[#2B5371]"
          (click)="isMenuOpen = false"
        >
          {{ item.label }}
        </a>
      </li>
    </ul>
  </nav>
</header>
