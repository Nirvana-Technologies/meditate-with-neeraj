<div class="bg-[#3D6130] text-white p-5 md:!p-10">
  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6 w-full">
    <div class="items-center gap-3 md:flex hidden">
      <img src="assets/footerIcon.svg" alt="Social Icon" class="w-10 h-10" />
      <span class="font-bold text-2xl sm:text-3xl lg:text-4xl">
        Meditate With Neeraj
      </span>
    </div>

    <div class="flex items-end justify-between w-full md:w-auto gap-4">
      <div class="md:hidden">
        <img src="assets/footerIcon.svg" alt="Social Icon" class="w-14 h-14" />
      </div>

      <div class="flex flex-col items-start md:items-end w-full md:w-auto mt-4 md:mt-0">
        <span class="text-2xl">Follow us on social media</span>
        <div class="flex gap-4 mt-2">
          <img *ngFor="let icon of socialIcons" [src]="icon" alt="Social"
            class="w-8 h-8 cursor-pointer hover:scale-110 transition-transform duration-200" />
        </div>
      </div>
    </div>
  </div>

  <hr class="w-full border-t border-white/30" />

  <div class="flex flex-col items-center text-center gap-2 text-2xl">
    <span>© 2025 Meditate with Neeraj | All rights reserved</span>
    <div class="cursor-pointer hover:underline">Privacy Policy</div>
    <div class="cursor-pointer hover:underline">Terms & Conditions</div>
  </div>
</div>
